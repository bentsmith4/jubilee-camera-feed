name: Jubilee Runtime Tests

on:
  pull_request:
    paths:
      - 'model_data/desktop_acceptance.py'
      - 'model_data/desktop_acceptance_*.json'
      - 'model_data/desktop_acceptance_evidence/**'
      - 'tests/test_desktop_acceptance_receipt.py'
      - "model_data/ingest_asos_weather.py"
      - "model_data/build_readiness.py"
      - "model_data/sensor_contract.json"
      - ".github/workflows/asos_weather.yml"
      - ".github/workflows/sensing_quality.yml"
      - "desktop_runtime/**"
      - "tools/desktop*"
      - "tools/first_dawn_acceptance.py"
      - "tools/pr34*"
      - ".github/workflows/pr34_dawn_followup.yml"
      - ".github/workflows/first_dawn_acceptance.yml"
      - "tests/**"
      - "requirements-tests.txt"
      - ".github/workflows/runtime_tests.yml"
  push:
    branches: [main]
    paths:
      - 'model_data/desktop_acceptance.py'
      - 'model_data/desktop_acceptance_*.json'
      - 'model_data/desktop_acceptance_evidence/**'
      - 'tests/test_desktop_acceptance_receipt.py'
      - "model_data/ingest_asos_weather.py"
      - "model_data/build_readiness.py"
      - "model_data/sensor_contract.json"
      - ".github/workflows/asos_weather.yml"
      - ".github/workflows/sensing_quality.yml"
      - "desktop_runtime/**"
      - "tools/desktop*"
      - "tools/first_dawn_acceptance.py"
      - "tools/pr34*"
      - ".github/workflows/pr34_dawn_followup.yml"
      - ".github/workflows/first_dawn_acceptance.yml"
      - "tests/**"
      - "requirements-tests.txt"
      - ".github/workflows/runtime_tests.yml"

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-tests.txt -r requirements-model-data.txt
      - name: Compile desktop runtime
        run: python -m compileall -q desktop_runtime
      - name: Run regression suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  windows-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline verifier test dependencies
        run: python -m pip install -r requirements-tests.txt tzdata
      - name: Exercise read-only PowerShell entry point with task fixtures
        run: python -B -m unittest discover -s tests -p "test_desktop_preflight.py" -v
