name: J09 NGOFS2 PORTS current validation probe
on:
  push:
    branches: [research/j09-oxygen-current-20260917]
    paths:
      - '.github/workflows/j09_ngofs2_ports_probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install netCDF4 numpy requests
      - name: Probe model schema and observed currents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ngofs_ports_probe
          python - <<'PY'
          import json, requests
          from pathlib import Path
          import netCDF4
          cycle_date='20260917'; cycle='21'
          roots=[
            f'https://opendap.co-ops.nos.noaa.gov/threddsdev/fileServer/NOAA/NGOFS2/MODELS/2026/09/17/ngofs2.t{cycle}z.{cycle_date}.stations.nowcast.nc',
            f'https://opendap.co-ops.nos.noaa.gov/threddsdev/fileServer/NOAA/NGOFS2/MODELS/2026/09/17/ngofs2.t{cycle}z.{cycle_date}.stations.forecast.nc'
          ]
          result={'production_action':'NO_CHANGE','model_files':[],'ports':[]}
          for url in roots:
            fn=Path('ngofs_ports_probe')/url.rsplit('/',1)[-1]
            try:
              r=requests.get(url,timeout=90); r.raise_for_status(); fn.write_bytes(r.content)
              ds=netCDF4.Dataset(fn)
              meta={'url':url,'bytes':len(r.content),'dimensions':{k:len(v) for k,v in ds.dimensions.items()},'variables':{}}
              for n,v in ds.variables.items():
                meta['variables'][n]={'dimensions':list(v.dimensions),'shape':list(v.shape),'dtype':str(v.dtype),'attrs':{a:str(getattr(v,a)) for a in v.ncattrs() if a in ('long_name','standard_name','units','positive')}}
              result['model_files'].append(meta)
              ds.close()
            except Exception as e:
              result['model_files'].append({'url':url,'error':repr(e)})
          for station in ('mb0302','mb0402','mb0501'):
            rec={'station':station}
            meta_url=f'https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/{station}.json'
            try: rec['metadata']=requests.get(meta_url,timeout=30).json()
            except Exception as e: rec['metadata_error']=repr(e)
            data_url=('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?'
                      f'product=currents&application=jubilee_model_research&begin_date=20260915&end_date=20260918&station={station}&time_zone=gmt&units=metric&interval=h&format=json')
            try: rec['currents_url']=data_url; rec['currents']=requests.get(data_url,timeout=30).json()
            except Exception as e: rec['currents_error']=repr(e)
            header_url=('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?'
                      f'product=currents_header&application=jubilee_model_research&begin_date=20260915&end_date=20260918&station={station}&time_zone=gmt&units=metric&format=json')
            try: rec['header']=requests.get(header_url,timeout=30).json()
            except Exception as e: rec['header_error']=repr(e)
            result['ports'].append(rec)
          Path('ngofs_ports_probe/probe.json').write_text(json.dumps(result,indent=2)+'\n')
          for p in Path('ngofs_ports_probe').glob('*.nc'): p.unlink()
          print(json.dumps(result,indent=2)[:50000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: j09-ngofs2-ports-probe-${{ github.run_number }}
          path: ngofs_ports_probe/probe.json
          retention-days: 30
