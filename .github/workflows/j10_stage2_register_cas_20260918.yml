name: J10 Stage2 specificity canonical register CAS append
on:
  push:
    branches: [research/j09-oxygen-current-20260917]
    paths:
      - '.github/workflows/j10_stage2_register_cas_20260918.yml'
permissions:
  contents: write
jobs:
  append-main-register:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append Stage2 evidence to canonical main register with exact blob CAS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jubilee-model-bot'
          git config user.email 'actions@users.noreply.github.com'
          expected='1a227952e53d11e652b5c01b18fc5f61b33c862a'
          marker='J10 Stage-2 specificity falsification — 2026-09-18'
          git fetch origin main
          git checkout -B j10-stage2-register origin/main
          actual=$(git rev-parse HEAD:model_data/MODEL_WORK_REGISTER.md)
          if [ "$actual" != "$expected" ]; then
            if grep -Fq "$marker" model_data/MODEL_WORK_REGISTER.md; then exit 0; fi
            echo "Canonical register changed: expected $expected got $actual; refusing append" >&2
            exit 3
          fi
          printf '%s\n' '' \
            '## J10 Stage-2 specificity falsification — 2026-09-18' \
            '' \
            '- **Observed-current event context:** A NOAA PORTS historical probe recovered representative-bin current records for five modern confirmed Jubilee mornings across mb0302/mb0402/mb0501 plus the 2010 Point Clear morning at historic bay-mouth station mb0101. Among the 15 modern upper-bay station-event pairs, eastward displacement was positive in 13/15 at 1 h, 14/15 at 3 h and 15/15 at 6 h; median 6-h eastward displacement was about +285 m. All five modern event mornings had positive three-station mean eastward displacement at 1/3/6 h. However, 2010-08-12 Point Clear had strongly westward flow at bay-mouth mb0101, reaching about -9.46 km integrated east displacement over 6 h. This rules out a universal bay-mouth-eastward trigger.' \
            '- **Same-month unlabeled-background specificity test rejected the simple feature:** Research artifact `model_data/j10_event_current_background_20260918.json` on branch `research/j09-oxygen-current-20260917` ranked the three-station 00:00-06:00 eastward displacement of five modern event mornings against every complete day in the same month, while retaining all other days as UNLABELED rather than negatives. Event 6-h percentiles were approximately 81st (2024-06-12), 23rd (2025-07-17), 19th (2025-07-24), 37th (2026-08-29) and 48th (2026-08-30). Four of five events were therefore ordinary-to-low relative to their monthly background. Aggregate upper-bay eastward 6-h displacement is **REJECTED as a standalone Stage-2 predictive feature**; directional sign alone is common and lacks specificity.' \
            '- **Stage-2 implication:** Preserve local, vertically resolved and phase-sensitive transport/contact hypotheses rather than a generic eastward-current rule. This result does not prove transport irrelevant; it falsifies the tested aggregate representation. Because background days remain unlabeled, this is a distribution/rank diagnostic and not an estimate of false-alert rate, specificity, calibration or causality.' \
            '- **Independent Stage-1 source lead sharpened:** Park, Kim & Schroeder (2007), DOI 10.1007/BF02782967, documents a Jul-Sep 2004 Mobile Bay mooring at 30.5470833, -87.9559 with bottom and upper sondes at 0.8 and 3.3 m above bottom, 20-min sampling and bottom-mounted 600-kHz ADCP. Published results show hypoxia was rare when the vertical salinity gradient was <2 psu, common when >4 psu, and nearly ubiquitous above 8 psu absent extreme events; bottom DO fell rapidly after restratification. Raw row-level time series have not yet been recovered, so this remains **SOURCE_DISCOVERED_NOT_INGESTED**, not model data.' \
            '- **Production boundary:** No production weight, threshold, alert logic, event/non-event label, sensing cadence, camera, physical sensor, credential, automation role or production artifact changed.' \
            >> model_data/MODEL_WORK_REGISTER.md
          git add model_data/MODEL_WORK_REGISTER.md
          git commit -m 'Record Stage2 specificity falsification evidence'
          base=$(git rev-parse HEAD^)
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$base" ]; then
            echo 'Main moved after append; refusing non-fast-forward write' >&2
            exit 4
          fi
          git push origin HEAD:main
