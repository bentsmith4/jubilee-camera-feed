name: Water quality ingest and backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'model_data/ingest_water_quality.py'
      - 'model_data/backtest_water_quality.py'
      - 'model_data/water_quality_sources.json'
      - 'model_data/event_history.json'
      - '.github/workflows/water_quality_ingest.yml'
  schedule:
    - cron: '17 11 * * 2'
permissions:
  contents: write
concurrency:
  group: jubilee-water-quality-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  ingest-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression-test dependency
        run: python -m pip install -r requirements-tests.txt
      - name: Validate code before ingest
        run: python -m unittest discover -s tests -v
      - name: Ingest public water-quality data
        run: python model_data/ingest_water_quality.py
      - name: Run conservative diagnostic, not a validated forecasting backtest
        run: python model_data/backtest_water_quality.py
      - name: Build auditable run summary
        run: |
          python - <<'PY'
          import collections, csv, datetime, json, pathlib
          p = pathlib.Path('model_data')
          manifest = json.loads((p/'water_quality_ingest_manifest.json').read_text())
          bt = json.loads((p/'water_quality_backtest.json').read_text())
          with (p/'water_quality_normalized.csv').open(encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f))
          report = {
              'generated_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'normalized_rows': len(rows), 'distinct_stations': len({r['station_id'] for r in rows}),
              'parameter_counts': dict(collections.Counter(r['parameter'] for r in rows)),
              'ingest_status': manifest['status'], 'ingest_sources': manifest['sources'],
              'unimplemented_sources': manifest.get('unimplemented_sources', []),
              'confirmed_events_in_database': bt['confirmed_events_in_database'],
              'confirmed_events_with_any_water_quality_data': bt['confirmed_events_with_any_water_quality_data'],
              'event_linked_observations_across_tests': bt['event_linked_observations_across_tests'],
              'unique_event_linked_observations': bt['unique_event_linked_observations'],
              'same_day_pairs_excluded': bt['same_day_event_sample_pairs_excluded'],
              'verified_matched_non_event_count': bt['verified_matched_non_event_count'],
              'sufficient_for_production_promotion': False,
              'production_action': 'NO_CHANGE', 'predictive_validity': 'NOT_ESTABLISHED',
              'guardrail': bt['guardrail'], 'durable_public_raw_archive': 'model_data/public_archive/wqp'
          }
          (p/'water_quality_run_summary.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Upload full public research dataset artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jubilee-water-quality-${{ github.run_number }}
          path: |
            model_data/raw_water_quality/
            model_data/public_archive/wqp/
            model_data/water_quality_normalized.csv
            model_data/water_quality_ingest_manifest.json
            model_data/water_quality_backtest.json
            model_data/water_quality_run_summary.json
          retention-days: 90
      - name: Persist compact records and immutable public raw observations
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          size = sum(p.stat().st_size for p in Path('model_data/public_archive').rglob('*') if p.is_file())
          if size > 250_000_000:
              raise SystemExit('Archive budget requires migration to object storage. Artifact retained; no history deleted.')
          PY
          git config user.name 'jubilee-model-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add model_data/water_quality_ingest_manifest.json model_data/water_quality_backtest.json model_data/water_quality_run_summary.json model_data/public_archive/wqp/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh validated water-quality research diagnostics and raw archive'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
