name: J09 J10 predictive push register append
on:
  push:
    branches: [research/j09-oxygen-current-20260917]
    paths:
      - '.github/workflows/j09_j10_register_append_20260918.yml'
permissions:
  contents: write
jobs:
  append-register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve append payload from research branch
        run: cp model_data/register_append_payload_j09_j10_20260918.md /tmp/register_append_payload.md
      - name: Append research evidence to latest main without force push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jubilee-model-bot'
          git config user.email 'actions@users.noreply.github.com'
          marker='J09/J10 predictive push — 2026-09-18'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B j09-j10-register-update origin/main
            if grep -Fq "$marker" model_data/MODEL_WORK_REGISTER.md; then
              echo 'Register marker already present.'
              exit 0
            fi
            cat /tmp/register_append_payload.md >> model_data/MODEL_WORK_REGISTER.md
            git add model_data/MODEL_WORK_REGISTER.md
            git commit -m 'Record J09 J10 predictive push evidence'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
