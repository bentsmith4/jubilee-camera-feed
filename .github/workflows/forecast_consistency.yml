name: Jubilee Forecast Consistency

on:
  pull_request:
    paths:
      - "model_data/reconcile_current_state.py"
      - "model_data/publish_current_state.py"
      - "tests/test_current_state_reconciliation.py"
      - "model_data/current_state_snapshot.json"
      - "model_data/current_forecast.json"
      - "model_data/bind_current_forecast.py"
      - "tests/test_current_forecast.py"
      - "tests/fixtures/forecast_binding/**"
      - ".github/workflows/forecast_consistency.yml"
  push:
    branches: [main]
    paths:
      - "model_data/reconcile_current_state.py"
      - "model_data/publish_current_state.py"
      - "tests/test_current_state_reconciliation.py"
      - "model_data/current_state_snapshot.json"
      - "model_data/current_forecast.json"
      - "model_data/bind_current_forecast.py"
      - "tests/test_current_forecast.py"
      - "tests/fixtures/forecast_binding/**"
      - ".github/workflows/forecast_consistency.yml"

permissions:
  contents: read

jobs:
  forecast-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run binding regressions
        run: python -B -m unittest discover -s tests -p "test_current_forecast.py" -v
      - name: Verify the checked-out snapshot and forecast as one pair
        run: python -B model_data/bind_current_forecast.py --check
