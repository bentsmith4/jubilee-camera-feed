name: Jubilee official ASOS observed weather
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: write
# Serialize with sensing_quality, which also writes these three public files.
concurrency:
  group: jubilee-sensing-quality-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify weather QC and freshness offline
        run: python -m unittest discover -s tests -p 'test_asos_weather.py' -v
      - name: Retrieve official airport observations
        id: asos
        continue-on-error: true
        run: python model_data/ingest_asos_weather.py
      - name: Preserve public weather evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jubilee-asos-${{ github.run_number }}
          path: |
            model_data/asos_weather_manifest.json
            model_data/asos_weather_normalized.json
            model_data/current_asos_weather.json
            model_data/public_archive/asos/
          retention-days: 90
      - name: Publish weather snapshot, including UNKNOWN on source outage
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          size = sum(p.stat().st_size for p in Path('model_data/public_archive').rglob('*') if p.is_file())
          if size > 250_000_000:
              raise SystemExit('Public Git archive budget exceeded; preserve the artifact and migrate storage, do not delete history.')
          PY
          git config user.name 'jubilee-model-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add model_data/asos_weather_manifest.json model_data/asos_weather_normalized.json model_data/current_asos_weather.json
          if [ -d model_data/public_archive/asos ]; then git add model_data/public_archive/asos/; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record official ASOS weather and freshness status'
          for attempt in 1 2 3; do
            git fetch origin "$REF_NAME"
            if ! git rebase "origin/$REF_NAME"; then
              git rebase --abort
              exit 1
            fi
            if git push origin "HEAD:$REF_NAME"; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Escalate parser defects after publishing UNKNOWN
        if: always() && steps.asos.outcome == 'failure'
        run: exit 1
