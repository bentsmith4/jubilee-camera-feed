name: Jubilee research quality
on:
  pull_request:
    branches: [main]
    paths:
      - 'model_data/**'
      - 'tests/**'
      - 'requirements-tests.txt'
      - 'requirements-model-data.txt'
      - '.github/workflows/research_quality.yml'
permissions:
  contents: read
concurrency:
  group: jubilee-research-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression and model-data dependencies
        run: python -m pip install -r requirements-tests.txt -r requirements-model-data.txt
      - name: Compile new research scripts
        run: |
          python -m py_compile \
            model_data/ingest_weeks_bay_realtime.py \
            model_data/ingest_ngofs2_point_clear.py \
            model_data/ingest_ngofs2_mobile_bay_named_stations.py \
            model_data/ingest_griidc_main_pass_20160419.py \
            model_data/build_historical_recovery_status.py \
            model_data/build_observation_effort_snapshot.py
      - name: Run full offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Build historical recovery diagnostic
        run: python model_data/build_historical_recovery_status.py
      - name: Validate machine-readable contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = [
              'model_data/sensor_deployment_spec_437_pier.json',
              'model_data/private_camera_signal_contracts.json',
              'model_data/public_camera_signal_contracts.json',
              'model_data/historical_event_candidate_additions_20260906.json',
              'model_data/source_registry_additions_20260906.json',
              'model_data/ngofs2_ingestion_contract.json',
              'model_data/ngofs2_multicell_contract.json',
              'model_data/historical_ingestion_priority.json',
              'model_data/matched_control_contract.json',
              'model_data/public_camera_observation_log.json',
              'model_data/historical_recovery_status.json',
          ]
          for name in files:
              json.loads(Path(name).read_text(encoding='utf-8'))
              print('valid json:', name)
          PY
