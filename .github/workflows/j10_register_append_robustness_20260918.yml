name: J10 append loading robustness evidence to research register
on:
  push:
    branches: [research/j09-oxygen-current-20260917]
    paths:
      - '.github/workflows/j10_register_append_robustness_20260918.yml'
permissions:
  contents: write
jobs:
  append-register:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append only under exact register blob guard
        shell: bash
        run: |
          set -euo pipefail
          expected='dfb7ee9f409a1b51202fcd7402884eb137e450c1'
          actual=$(git rev-parse HEAD:model_data/MODEL_WORK_REGISTER.md)
          if [ "$actual" != "$expected" ]; then
            echo "Register changed: expected $expected got $actual; refusing write" >&2
            exit 3
          fi
          marker='J09/J10 predictive continuation — loading robustness and transport trust bounds — 2026-09-18'
          if grep -Fq "$marker" model_data/MODEL_WORK_REGISTER.md; then exit 0; fi
          printf '%s\n' '' \
            '## J09/J10 predictive continuation — loading robustness and transport trust bounds — 2026-09-18' \
            '' \
            '- **Scope/safety:** Research branch only. No production forecast weight, threshold, alert policy, camera cadence, event label, clean-control label, physical sensor, credential, paid service, or canonical data was changed or deleted.' \
            '- **Stage-1 loading data are now normalized and episodic rather than discovery-only:** NCEI 0188979 contributes 9,014 ten-minute moored CTD rows with validated MATLAB-datenum/CDT conversion. Dissolved oxygen is percent saturation, not mg/L. Station 01 contains a 200.7-hour episode below 20% saturation and a 147-hour episode below 10% saturation. NCEI 0176497 adds 268 true vertical profiles with mg/L oxygen (six profiles with analysis-derived bottom-median DO <2 mg/L). NCEI 0190491 independently corroborates the salinity-gradient/low-oxygen relationship in percent saturation.' \
            '- **Loading-state shadow skill survived additional stress tests:** `model_data/j10_loading_robustness_20260918.json` independently reanalyzed the 0176497 profile artifact. Leave-one-survey-date-out AUC/Brier/log-loss were 0.768/0.02350/0.10513 for salinity-gradient-only and 0.961/0.01840/0.06453 after adding profile depth and bottom temperature. A within-date depth+temperature permutation test (500 permutations) produced one-sided empirical p=0.001996 for the observed +0.193 AUC increment. Three-way latitude spatial blocking scored 0.842/0.01590/0.07736 versus 0.803/0.02126/0.09815 for gradient-only. Adding absolute surface/bottom salinity degraded the spatial-blocked result (AUC 0.736, Brier 0.03452, log loss 0.13858). Only six positive profiles exist; uncertainty remains wide and this is oxygen-loading skill, not Jubilee-event skill.' \
            '- **Observed-current validation materially limits NGOFS2 interpretation:** `model_data/j09_ports_ngofs_validation_20260918.json` aligns 1,607 NOAA PORTS observations at mb0302/mb0402/mb0501 to nine Sep. 15–17 NGOFS2 station-nowcast cycles. Depth-mean principal-axis 6-hour transport correlations are about 0.71–0.82, but vector direction errors are roughly 75–95 degrees and sign agreement is frequently near chance; magnitude bias varies by station/vertical representation. `model_data/j09_ngofs_historical_validation_2010_2011_20260918.json` adds independent NOAA historical context at Mobile Bay Buoy M: older NGOFS lineage reproduced broad current variability while flood/ebb direction RMSE was about 41–44 degrees. NGOFS2 remains timing/oscillation MODEL guidance, not a precise Point Clear shoreline-normal current observation.' \
            '- **Observed transport has physically meaningful multi-hour memory:** NCEI 0211052 FOCAL AWAC retained 23,664 current profiles and 7,888 hourly vectors; median observed displacement magnitude grows from 1.08 km at 3 h to 3.99 km at 12 h, 7.38 km at 24 h and 13.86 km at 48 h. This supports separate multi-hour/multi-day loading and short-term contact/transport latent states.' \
            '- **Control-label discipline is unchanged:** Eighteen same-date spatial/depth controls around the six hypoxic 0176497 profiles are physical loading-state controls only, not Jubilee non-events. The June 12, 2024 May Day same-morning contrast is stronger than a no-report day but still lacks sufficient scope/duration/detectability/directness and exact feature joins. Verified clean Jubilee training controls remain **zero**.' \
            '- **Measured model-quality impact:** Stage 1 (`hypoxic_water_available`) is now quantitatively supported and has a compact shadow feature set that improves out-of-date and spatially blocked oxygen-loading discrimination/probabilistic scoring. Stage 2 (`shoreward_transport/contact`) remains unvalidated at Point Clear. Event-level Jubilee discrimination, calibration, false-alert behavior and useful lead time remain **NOT_ESTABLISHED**; no production promotion is justified.' \
            '- **Next gates:** recover observed current closer to Point Clear/Eastern Shore or an equivalent defensible local proxy; expand source-backed scoped control mornings with explicit observation effort/visibility; build leakage-safe event/control feature windows using `available_at <= issue_time`; then compare loading-only, trigger-only and loading×trigger shadow models under event/episode-blocked validation.' \
            >> model_data/MODEL_WORK_REGISTER.md
          git config user.name 'jubilee-model-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add model_data/MODEL_WORK_REGISTER.md
          git commit -m 'Record J09 J10 loading robustness evidence'
          git push origin HEAD:research/j09-oxygen-current-20260917
