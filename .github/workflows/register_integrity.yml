name: Register integrity
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preserve-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: tools
          persist-credentials: false
      - name: Compare target history with the proposed merge
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python tools/check_register_append.py "$BASE" HEAD
