name: J09 canonical register update

on:
  workflow_dispatch:
  push:
    branches:
      - research/j09-oxygen-current-20260917
    paths:
      - '.github/workflows/j09_register_update.yml'

permissions:
  contents: read

jobs:
  validate-research-register-path:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Validate research evidence is present
        shell: bash
        run: |
          set -euo pipefail
          test -f model_data/j09_data_access_upgrade_20260917.json
          echo 'J09 research evidence present; canonical register writes are handled separately with compare-and-swap on main.'
