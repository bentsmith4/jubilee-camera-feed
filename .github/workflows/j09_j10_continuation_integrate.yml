name: J09 J10 continuation evidence validation
on:
  push:
    branches: [research/j09-oxygen-current-20260917]
    paths:
      - '.github/workflows/j09_j10_continuation_integrate.yml'
permissions:
  contents: read
jobs:
  validate-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate expected research evidence exists
        shell: bash
        run: |
          set -euo pipefail
          test -s model_data/j09_ports_ngofs_validation_20260918.json
          test -s model_data/j09_0176497_vertical_profile_research_20260918.json
          test -s model_data/j09_0190491_vertical_profile_research_20260918.json
          test -s model_data/j10_0176497_dateblocked_shadow_20260918.json
          test -s model_data/j10_control_candidate_20240612_mayday_20260918.json
          test -s model_data/j10_two_stage_hypothesis_validation_20260918.json
          test -s model_data/j09_middle_bay_geometry_research_20260918.json
          echo 'Research evidence paths validated. Canonical writeback uses explicit current-SHA compare-and-swap, not this workflow.'
