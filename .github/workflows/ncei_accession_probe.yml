name: Temporary data-endpoint probe
on:
  push:
    branches: [upgrade/top5-gaps-round2-20260906]
    paths:
      - '.github/workflows/ncei_accession_probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve high-value NCEI Mobile Bay archive routes without retaining payloads
        shell: bash
        run: |
          python - <<'PY'
          import html.parser, urllib.error, urllib.request

          ACCESSIONS = [
              ('0188979','188979'),
              ('0224293','224293'),
              ('0176497','176497'),
          ]
          class Links(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      href=dict(attrs).get('href')
                      if href: self.links.append(href)

          for padded, numeric in ACCESSIONS:
              print(f'===== ACCESSION {padded} =====')
              candidates = [
                  f'https://www.ncei.noaa.gov/archive/accession/download/{padded}',
                  f'https://www.ncei.noaa.gov/archive/archive-management-system/OAS/bin/prd/jquery/accession/download/{numeric}',
                  f'https://www.ncei.noaa.gov/data/oceans/ncei/archive/data/{padded}/',
                  f'https://www.ncei.noaa.gov/thredds-ocean/catalog/ncei/archive/data/{padded}/catalog.html',
              ]
              for url in candidates:
                  req=urllib.request.Request(url, headers={'User-Agent':'jubilee-research/1.0','Range':'bytes=0-131071'})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body=r.read(131072)
                          print('OK', url)
                          print('FINAL', r.geturl())
                          print('STATUS', getattr(r,'status',None), 'TYPE', r.headers.get('Content-Type'), 'LEN', r.headers.get('Content-Length'))
                          if b'<html' in body.lower() or b'<a ' in body.lower() or b'<?xml' in body.lower():
                              text=body.decode('utf-8',errors='replace')
                              parser=Links(); parser.feed(text)
                              links=[x for x in parser.links if any(k in x.lower() for k in ('.nc','.csv','.txt','.zip','.gz','catalog','file'))]
                              print('LINKS', links[:30])
                          else:
                              print('PREFIX_BYTES', len(body), 'NON_HTML_PAYLOAD_NOT_RETAINED')
                  except urllib.error.HTTPError as e:
                      print('HTTP_ERROR', e.code, url, 'FINAL', e.geturl())
                  except Exception as e:
                      print('ERROR', type(e).__name__, url, str(e)[:240])
          PY
