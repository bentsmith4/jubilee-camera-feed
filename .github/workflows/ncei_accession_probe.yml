name: Temporary data-endpoint probe
on:
  push:
    branches: [upgrade/top5-gaps-round2-20260906]
    paths: ['.github/workflows/ncei_accession_probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve GRIIDC ERDDAP priority datasets without retaining payloads
        shell: bash
        run: |
          set -u
          for term in R4_x260_000_0055 R4_x260_000_0051 R4_x260_204_0033 R4_x260_000_0106 R4_x260_204_0031; do
            echo "===== SEARCH $term ====="
            python - "$term" <<'PY' || true
          import json, sys, urllib.parse, urllib.request
          term = sys.argv[1]
          url = 'https://erddap.griidc.org/erddap/search/index.json?' + urllib.parse.urlencode({'page':1,'itemsPerPage':1000,'searchFor':term})
          req = urllib.request.Request(url, headers={'User-Agent':'jubilee-research/1.0'})
          with urllib.request.urlopen(req, timeout=30) as r: doc=json.load(r)
          cols=doc.get('table',{}).get('columnNames',[]); rows=doc.get('table',{}).get('rows',[])
          print('MATCHES', len(rows))
          for row in rows[:100]:
              item=dict(zip(cols,row))
              print(json.dumps({k:item.get(k) for k in ['Dataset ID','Title','Institution','tabledap','Info']}, ensure_ascii=False))
          PY
          done
          echo '===== MAIN PASS SAMPLE SCHEMA/CSV ====='
          python - <<'PY' || true
          import json, urllib.request
          did='R4_x260_000_0055_DZ_19April2016_mini000_ce'
          for suffix in [f'/erddap/info/{did}/index.json', f'/erddap/tabledap/{did}.csv']:
              url='https://erddap.griidc.org'+suffix
              req=urllib.request.Request(url,headers={'User-Agent':'jubilee-research/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read(12000)
              print('URL',url,'PREFIX_BYTES',len(body))
              print(body.decode('utf-8','replace')[:12000])
          PY
