name: Temporary data-endpoint probe
on:
  push:
    branches: [upgrade/top5-gaps-round2-20260906]
    paths:
      - '.github/workflows/ncei_accession_probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public GRIIDC FOCAL page for file and API routes without retaining media
        shell: bash
        run: |
          python - <<'PY'
          import html.parser, json, re, urllib.parse, urllib.request

          URLS = [
              'https://data.griidc.org/data/R4.x260.204%3A0033',
              'https://data.griidc.org/data/R4.x260.000%3A0106',
          ]
          class Links(html.parser.HTMLParser):
              def __init__(self): super().__init__(); self.links=[]; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag == 'a' and d.get('href'): self.links.append(d['href'])
                  if tag == 'script' and d.get('src'): self.scripts.append(d['src'])
          for url in URLS:
              print('===== PAGE',url,'=====')
              req=urllib.request.Request(url,headers={'User-Agent':'jubilee-research/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read(5_000_000).decode('utf-8',errors='replace')
                  print('STATUS',getattr(r,'status',None),'FINAL',r.geturl(),'BYTES',len(body))
              p=Links(); p.feed(body)
              interesting=[]
              for x in p.links+p.scripts:
                  low=x.lower()
                  if any(k in low for k in ('download','file','erddap','api','0033','0106','dataset','metadata')):
                      interesting.append(urllib.parse.urljoin(url,x))
              print('INTERESTING_LINKS',json.dumps(interesting[:200],indent=2))
              for needle in ('R4.x260.204:0033','R4.x260.000:0106','Individual Files','ERDDAP','NCEI','download','files'):
                  indexes=[m.start() for m in re.finditer(re.escape(needle),body,re.I)]
                  print('NEEDLE',needle,'COUNT',len(indexes))
                  for pos in indexes[:5]:
                      print('CONTEXT',re.sub(r'\\s+',' ',body[max(0,pos-400):pos+900])[:1400])
          PY
