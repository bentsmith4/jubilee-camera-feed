name: Temporary data-endpoint probe
on:
  push:
    branches: [upgrade/top5-gaps-round2-20260906]
    paths:
      - '.github/workflows/ncei_accession_probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve NCEI accession 0248354 public file routes without retaining payloads
        shell: bash
        run: |
          python - <<'PY'
          import html.parser, re, urllib.error, urllib.parse, urllib.request

          URLS = [
              'https://www.ncei.noaa.gov/archive/accession/0248354',
              'https://www.ncei.noaa.gov/archive/accession/oas/248354',
              'https://www.ncei.noaa.gov/archive/accession/download/248354',
              'https://www.ncei.noaa.gov/metadata/geoportal/rest/metadata/item/gov.noaa.nodc%3A0248354',
              'https://www.ncei.noaa.gov/metadata/geoportal/rest/metadata/item/gov.noaa.nodc%3A0248354/html',
          ]
          class Links(html.parser.HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      href=dict(attrs).get('href')
                      if href: self.links.append(href)
          for url in URLS:
              print('===== URL',url,'=====')
              req=urllib.request.Request(url,headers={'User-Agent':'jubilee-research/1.0','Range':'bytes=0-4999999'})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      body=r.read(5_000_000)
                      ctype=r.headers.get('Content-Type') or ''
                      print('STATUS',getattr(r,'status',None),'FINAL',r.geturl(),'TYPE',ctype,'CONTENT_LENGTH',r.headers.get('Content-Length'),'READ',len(body))
                  text=body.decode('utf-8',errors='replace')
                  p=Links(); p.feed(text)
                  urls=[]
                  for x in p.links:
                      full=urllib.parse.urljoin(url,x)
                      if any(k in full.lower() for k in ('0248354','248354','download','file','data.nodc','data/oceans','.txt','.zip','.tar','.gz','.dat','.csv','.nc')):
                          urls.append(full)
                  urls += re.findall(r'https?://[^\s"\'<>]+',text)
                  dedup=[]
                  for x in urls:
                      x=x.replace('&amp;','&')
                      if x not in dedup and any(k in x.lower() for k in ('0248354','248354','download','data.nodc','data/oceans','.txt','.zip','.tar','.gz','.dat','.csv','.nc')):
                          dedup.append(x)
                  print('INTERESTING_URLS')
                  for x in dedup[:300]: print(x[:1200])
                  for needle in ('0248354','download','resource','distribution','onlineResource','fileIdentifier'):
                      positions=[m.start() for m in re.finditer(needle,text,re.I)]
                      print('NEEDLE',needle,'COUNT',len(positions))
                      for pos in positions[:8]:
                          print('CONTEXT',re.sub(r'\s+',' ',text[max(0,pos-300):pos+1000])[:1400])
              except urllib.error.HTTPError as e:
                  print('HTTP_ERROR',e.code,'FINAL',e.geturl(),'LOCATION',e.headers.get('Location'))
              except Exception as e:
                  print('ERROR',type(e).__name__,str(e)[:500])
          PY
