name: Temporary data-endpoint probe
on:
  push:
    branches: [upgrade/top5-gaps-round2-20260906]
    paths: ['.github/workflows/ncei_accession_probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve GRIIDC ERDDAP dataset IDs without retaining payloads
        shell: bash
        run: |
          set -euo pipefail
          for term in R4_x260_000_0055 N75X279Z R4_x260_000_0051 N7154FF5; do
            echo "===== SEARCH $term ====="
            python - "$term" <<'PY'
          import json, sys, urllib.parse, urllib.request
          term = sys.argv[1]
          url = 'https://erddap.griidc.org/erddap/search/index.json?' + urllib.parse.urlencode({
              'page': 1, 'itemsPerPage': 1000, 'searchFor': term
          })
          req = urllib.request.Request(url, headers={'User-Agent':'jubilee-research/1.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              doc = json.load(r)
          print('URL', url)
          cols = doc.get('table',{}).get('columnNames',[])
          for row in doc.get('table',{}).get('rows',[]):
              item = dict(zip(cols,row))
              print(json.dumps({k:item.get(k) for k in ['Dataset ID','Title','Institution','tabledap','griddap','Info'] if k in item}, ensure_ascii=False))
          PY
          done
