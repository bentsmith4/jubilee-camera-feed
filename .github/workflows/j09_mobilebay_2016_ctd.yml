name: J09 Mobile Bay 2016 moored CTD research ingest
on:
  push:
    branches: [research/j09-oxygen-current-20260917]
    paths:
      - '.github/workflows/j09_mobilebay_2016_ctd.yml'
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install netCDF dependency
        run: python -m pip install netCDF4
      - name: Fetch and inspect public NCEI CTDs without assuming CF time semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobilebay_2016_ctd/raw
          python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          import netCDF4, numpy as np
          root='https://www.ncei.noaa.gov/data/oceans/archive/arc0138/0188979/1.1/data/0-data/'
          files=[f'Mobile_Bay_Station0{i}_July2016.nc' for i in (1,2,3)]
          out={'schema_version':'1.1','accession':'0188979','production_action':'NO_CHANGE','source_root':root,'stations':[]}
          for fn in files:
            url=root+fn; raw=Path('mobilebay_2016_ctd/raw')/fn
            req=urllib.request.Request(url,headers={'User-Agent':'jubilee-model-research/1.0'})
            with urllib.request.urlopen(req,timeout=45) as r: body=r.read()
            raw.write_bytes(body)
            ds=netCDF4.Dataset(raw)
            rec={'filename':fn,'url':url,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),'dimensions':{k:len(v) for k,v in ds.dimensions.items()},'global_attributes':{a:str(getattr(ds,a)) for a in ds.ncattrs()},'variables':{}}
            for name,v in ds.variables.items():
              attrs={a:str(getattr(v,a)) for a in v.ncattrs()}
              arr=np.ma.filled(v[:],np.nan)
              flat=np.asarray(arr).reshape(-1)
              sample=[]
              for x in flat[:8]:
                try: sample.append(float(x))
                except Exception: sample.append(str(x))
              stats=None
              try:
                q=np.asarray(arr,dtype=float).reshape(-1); q=q[np.isfinite(q)]
                if q.size: stats={'n':int(q.size),'min':float(q.min()),'median':float(np.median(q)),'max':float(q.max())}
              except Exception: pass
              rec['variables'][name]={'dimensions':list(v.dimensions),'shape':list(v.shape),'dtype':str(v.dtype),'attributes':attrs,'sample':sample,'stats':stats}
            out['stations'].append(rec); ds.close()
          Path('mobilebay_2016_ctd/manifest.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Upload research ingest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j09-mobilebay-2016-ctd-${{ github.run_number }}
          path: mobilebay_2016_ctd/
          retention-days: 30
